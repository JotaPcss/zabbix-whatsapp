zabbix_export:
  version: '6.0'
  date: '2026-11-11T00:00:00Z'
  groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: f627f079b3394903b2dca360bf79f2d1
      template: 'WhatsApp Evolution API by HTTP'
      name: 'WhatsApp Evolution API by HTTP'
      description: |
        Monitora se a instância da Evolution API usada pelos alertas está conectada ao WhatsApp.
        Envie os alertas DESTE template por e-mail/Telegram/SMS: se o WhatsApp caiu, ele não vai conseguir avisar de si mesmo.
        Preencha as macros {$EVOLUTION.URL}, {$EVOLUTION.INSTANCE} e {$EVOLUTION.APIKEY} no host.
      groups:
        - name: Templates/Applications
      items:
        - uuid: 608a77eba90c49c4b5f245643ae13c33
          name: 'Evolution: estado da conexão do WhatsApp'
          type: HTTP_AGENT
          key: evolution.instance.state
          delay: 1m
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'open = conectado; close/connecting = precisa ler o QR code novamente.'
          url: '{$EVOLUTION.URL}/instance/connectionState/{$EVOLUTION.INSTANCE}'
          headers:
            - name: apikey
              value: '{$EVOLUTION.APIKEY}'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.instance.state
          triggers:
            - uuid: 9740ba43072e4451bf911a7cf728090c
              expression: 'last(/WhatsApp Evolution API by HTTP/evolution.instance.state)<>"open"'
              name: 'WhatsApp da Evolution desconectado (estado: {ITEM.LASTVALUE1})'
              priority: HIGH
              description: 'Os alertas por WhatsApp NÃO estão saindo. Abra o /manager da Evolution e leia o QR code de novo.'
            - uuid: c26cf077184243948865b5271572c6e0
              expression: 'nodata(/WhatsApp Evolution API by HTTP/evolution.instance.state,5m)=1'
              name: 'Evolution API sem resposta há 5 minutos'
              priority: HIGH
              description: 'Container parado, URL/apikey erradas ou rede bloqueada entre o Zabbix e a Evolution.'
      macros:
        - macro: '{$EVOLUTION.APIKEY}'
          type: SECRET_TEXT
          description: 'AUTHENTICATION_API_KEY da Evolution'
        - macro: '{$EVOLUTION.INSTANCE}'
          value: zabbix
        - macro: '{$EVOLUTION.URL}'
          value: 'http://127.0.0.1:8080'
